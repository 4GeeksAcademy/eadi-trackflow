[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eadi-trackflow"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "python-multipart",
  "tinydb",
  "uvicorn[standard]",
]

[project.scripts]
seed = "seed:main"

[tool.setuptools]
py-modules = ["seed"]

[tool.uv.workspace]
members = [
    "services-autho-api",
]
